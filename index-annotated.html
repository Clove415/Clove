<!DOCTYPE html>
<!--
    Google自定义搜索引擎页面
    功能：提供可切换搜索引擎的搜索界面（Google、Bing、百度、Yandex）
    作者：匿名
    创建时间：2023年
    更新：2025年添加Yandex搜索引擎支持
-->
<html lang="en">
<head>
    <!-- 页面头部元数据 -->
    <meta charset="UTF-8">
    <link rel="icon" href="img/log.ico"> <!-- 网站图标 -->
    <title>首页</title>
</head>
<style>
    /* ========== 全局样式重置 ========== */
    * {
        /* 清除所有默认的内边距和外边距 */
        padding: 0;
        margin: 0;
        /* 移除列表样式和文本装饰 */
        list-style: none;
        text-decoration: none;
        /* 禁用文本选择，防止用户选中文本 */
        moz-user-select: -moz-none;
        -moz-user-select: none;
        -o-user-select: none;
        -khtml-user-select: none;
        -webkit-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }

    /* 链接默认样式 */
    a {
        color: black;
    }

    /* ========== 主容器样式 ========== */
    .container {
        display: flex;
        flex-direction: column; /* 垂直布局 */
        height: 100vh; /* 全屏高度 */
        background: url("img/01.jpg") center/cover no-repeat; /* 背景图片 */
    }

    /* ========== 顶部工具栏（导航栏）样式 ========== */
    .main-tool {
        display: flex;
        justify-content: flex-end; /* 右对齐 */
        width: 100%;
        height: 220px; /* 顶部工具栏高度 */
    }

    /* 工具栏内部列表容器 */
    .main-tool .list {
        padding: 15px 10px; /* 工具栏内边距 */
    }

    /* 工具栏每个选项（span） */
    .main-tool .list span {
        padding: 5px 10px; /* 选项内边距 */
        transition: all .3s; /* 鼠标悬停动画过渡效果 */
        border-radius: 7%; /* 圆角边框 */
    }

    /* 工具栏选项鼠标悬停效果 */
    .main-tool .list span:hover {
        background: #A4D3EE; /* 鼠标悬停时的背景色 */
    }

    /* ========== Logo区域样式 ========== */
    .main-log {
        display: flex;
        justify-content: center; /* 水平居中 */
        align-items: center; /* 垂直居中 */
        width: 100%;
        height: 150px; /* Logo区域高度 */
    }

    /* Logo背景图片容器 */
    .main-log .log {
        width: 350px;
        height: 70%;
        background: url("img/Clannad_Logo.svg") no-repeat;
        background-size: 100%; /* 图片自适应容器大小 */
    }

    /* ========== 搜索框容器样式 ========== */
    .search-box {
        display: flex;
        justify-content: center; /* 水平居中 */
        align-items: center; /* 垂直居中 */
        height: 100px; /* 搜索框容器高度 */
    }

    /* ========== 输入框容器样式 ========== */
    .search-box .input-box {
        overflow: hidden;
        display: flex;
        width: 30%;
        min-width: 400px; /* 最小宽度，防止过小 */
        height: 45px; /* 输入框高度 */
        border: 1px solid #DCDCDC; /* 边框样式 */
        background: white; /* 背景色 */
        border-radius: 32px; /* 圆角边框 */
        box-shadow: 1px 1px 6px 1px #DCDCDC; /* 阴影效果 */
    }

    /* 搜索图标容器（左侧放大镜图标） */
    .search-box .input-box .font-img {
        display: flex;
        justify-content: center; /* 水平居中 */
        align-items: center; /* 垂直居中 */
        width: 32px; /* 固定宽度 */
        padding: 0 7px; /* 左右内边距 */
        text-align: center;
    }

    /* 搜索表单样式 */
    .search-box .input-box form {
        display: flex;
        justify-content: flex-start; /* 左对齐 */
        align-items: center; /* 垂直居中 */
        flex: 1; /* 占据剩余空间 */
    }

    /* 搜索输入框样式 */
    .search-box .input-box form input {
        width: 100%;
        font-size: 16px;
        border: 0; /* 移除边框 */
        outline: none; /* 移除焦点轮廓 */
    }

    /* ========== 搜索引擎切换按钮样式 ========== */
    .browser-log {
        width: 45px; /* 切换按钮宽度 */
        padding: 0 7px; /* 左右内边距 */
        height: 100%; /* 高度100%继承父容器 */
    }

    /* 切换按钮内图标的容器 */
    .browser-log .font-img {
        position: relative; /* 相对定位，为绝对定位的子元素提供参考 */
        width: 100%;
        height: 100%;
    }

    /* ========== 搜索引擎图标显示控制 ========== */
    .google[data-browser='google'] {
        display: block !important; /* 显示Google图标 */
    }

    .edge[data-browser='edge'] {
        display: block !important; /* 显示Bing图标 */
    }

    .baidu[data-browser='baidu'] {
        display: block !important; /* 显示百度图标 */
    }

    .yandx[data-browser='yandx'] {
        display: block !important; /* 显示Yandex图标 */
    }

    /* 隐藏搜索引擎图标（单词拼写错误：hiiden 应为 hidden） */
    #browser-log .stats[data-browser='hiiden'] {
        display: none !important; /* 隐藏所有标记为hidden的图标 */
    }
</style>

<script>
    /* ===========================
       搜索引擎切换功能脚本
       =========================== */

    // 获取页面元素
    const search = document.getElementById('search-table');      // 搜索表单
    const searchInput = document.getElementById('search-input'); // 搜索输入框
    const browser = document.getElementById('switch-btn');       // 切换按钮
    const browserList = document.querySelectorAll('#browser-log div'); // 所有搜索引擎图标

    // 控制器：跟踪当前切换到第几个搜索引擎
    let controllerValue = 0;

    // 搜索引擎名称数组（用于data-browser属性和显示控制）
    let logArr = ['google', 'edge', 'baidu', 'yandx'];

    // 搜索引擎URL数组（对应每个搜索引擎的搜索地址）
    let searchArr = [
        'http://www.google.com/search',        // Google
        'http://cn.bing.com/search?',          // Bing
        'http://www.baidu.com/baidu',          // 百度
        'https://yandex.com/search/?text='     // Yandex
    ];


    /* ===========================
       快捷键功能
       按Insert键快速切换搜索引擎
       =========================== */
    window.addEventListener('keyup', (e) => {
        switch (e.code) {
            case 'Insert':  // Insert键触发
                browser.click(); // 模拟点击切换按钮
                break
        }
    })


    /* ===========================
       搜索引擎切换逻辑
       =========================== */
    browser.onclick = function () {
        let a = true; // 标记变量，控制切换流程

        // 重置搜索输入框的name属性为默认值
        searchInput.name = 'q';

        // 隐藏所有搜索引擎图标
        for (let i = 0; i < browserList.length; i++) {
            browserList[i].setAttribute('data-browser', 'hidden');
        }

        // 循环切换搜索引擎
        for (controllerValue; controllerValue < browserList.length;) {
            // 如果不是最后一个搜索引擎，则切换到下一个
            if (browserList[controllerValue + 1] != null && a) {
                // 显示下一个搜索引擎图标
                browserList[controllerValue + 1].setAttribute('data-browser', `${logArr[controllerValue + 1]}`);

                // 更新搜索表单的action属性（搜索地址）
                search.action = searchArr[controllerValue + 1];

                // 调试信息：输出当前选中的搜索引擎
                console.log(browserList[controllerValue + 1].getAttribute('data-browser'));

                // 根据不同搜索引擎设置对应的搜索参数名称
                if (logArr[controllerValue + 1] === 'baidu') {
                    // 百度使用 'wd' 作为搜索参数
                    searchInput.name = 'wd'
                } else if (logArr[controllerValue + 1] === 'yandx') {
                    // Yandex使用 'text' 作为搜索参数
                    searchInput.name = 'text'
                } else {
                    // Google和Bing使用 'q' 作为搜索参数
                    searchInput.name = 'q'
                }

                // 标记已处理，避免重复执行
                a = false;

                // 移动到下一个搜索引擎
                ++controllerValue;

            } else {
                // 如果是最后一个搜索引擎，则回到第一个
                browserList[controllerValue - 2].setAttribute('data-browser', `${logArr[controllerValue - 2]}`)
                search.action = searchArr[controllerValue - 2];
                controllerValue = 0; // 重置为第一个
            }

            // 退出循环，每次点击只切换一次
            console.log(controllerValue)
            break
        }
    }
</script>
